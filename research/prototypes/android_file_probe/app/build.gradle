plugins {
  id 'com.android.application'
}

android {
  namespace 'com.example.pgnfileprobe'
  compileSdk 35

  defaultConfig {
    applicationId 'com.example.pgnfileprobe'
    minSdk 24
    targetSdk 35
    versionCode 1
    versionName '1.0'
  }

  sourceSets {
    main.java.srcDirs = ['src/main/java']
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
