name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check generated database code
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/database/app_database.g.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyze application and tests
        run: flutter analyze lib test integration_test tool

      - name: Run unit and widget tests
        run: flutter test --no-pub test

      - name: Upload puzzle golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-golden-failures
          path: test/widget/features/puzzle_solver/failures
          if-no-files-found: ignore

      - name: Build Android debug application
        run: flutter build apk --debug --no-pub

      - name: Compile Android integration tests
        shell: bash
        run: |
          for test_file in integration_test/*_test.dart; do
            if [[ -f "$test_file" ]]; then
              flutter build apk --debug --no-pub --target "$test_file"
            fi
          done
